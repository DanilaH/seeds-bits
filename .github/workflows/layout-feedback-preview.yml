name: Layout fixes preview
on:
  push:
    branches: [research/seeds-layout-audit-20261120]
    paths: [src/**, e2e/layout-repair.spec.ts, .github/workflows/layout-feedback-preview.yml]
permissions:
  contents: read
concurrency:
  group: layout-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SEEDS_QA_PROFILE: baseline
      SEEDS_BUILD_FLAVOR: preview
      ADS_MODE: test
      APPMETRICA_API_KEY: ""
      APPMETRICA_QA_API_KEY: ""
      REQUIRE_MOBILE_CONFIG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v4
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npx playwright test e2e/layout-repair.spec.ts e2e/game.spec.ts e2e/porting-classic-add.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: layout-browser, path: test-results/}
      - run: npm run setup:android
      - run: GITHUB_RUN_NUMBER=953 node scripts/configure-android.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease
      - run: |
          mkdir -p test-results/apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk test-results/apk/seeds-layout-12053-unsigned.apk
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync("test-results/apk/source.json",JSON.stringify({source:process.env.GITHUB_SHA,versionCode:12053,profile:"baseline",analytics:false},null,2))'
      - uses: actions/upload-artifact@v4
        with: {name: layout-preview-unsigned, path: test-results/apk/}
