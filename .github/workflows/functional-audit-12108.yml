name: Independent functional audit 12108
on:
  push:
    branches: [qa/functional-audit-12108-20261127]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/functional-audit-12108.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: functional-model, path: test-results/functional-audit/}
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npx playwright test e2e/functional-audit-12108.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: functional-browser, path: test-results/}
