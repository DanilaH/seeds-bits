name: Verify exact 1.1.2 store APK navigation
on:
  push:
    branches: [qa/rustore-112-acceptance-20261113]
permissions:
  contents: read
  actions: read
jobs:
  android-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: seeds-112-store-unsigned
          path: exact-release/
          run-id: 43379345999
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact store payload without rebuilding
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          sha=hashlib.sha256(Path('exact-release/app-release-unsigned.apk').read_bytes()).hexdigest()
          assert sha=='eff2c5884543ce437285469c852e8c2ba2b72faa0983a8677f2232d17610b6cc'
          Path('test-results').mkdir(exist_ok=True)
          Path('test-results/store-acceptance-input.json').write_text(json.dumps({'sourceRunId':43379345999,'unsignedSha256':sha,'rebuilt':False,'versionCode':1102101},indent=2)+'\n')
          PY
      - run: python3 -m pip install --user pillow
      - name: Start Android 35 with network blocked before boot
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' 'build-tools;35.0.0'
          echo no | avdmanager create avd --force --name seeds_store_112_recheck --package 'system-images;android-35;google_apis;x86_64'
          bash scripts/ci-offline-emulator.sh seeds_store_112_recheck
          keytool -genkeypair -keystore /tmp/store112-check.p12 -storetype PKCS12 -storepass android -keypass android -alias smoke -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI Offline Store Recheck' -noprompt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/store112-check.p12 --ks-key-alias smoke --ks-pass pass:android --out /tmp/seeds-smoke.apk exact-release/app-release-unsigned.apk
          adb install /tmp/seeds-smoke.apk
      - run: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seeds-112-store-smoke-recheck
          path: |
            test-results/store-acceptance-input.json
            test-results/emulator/
            test-results/offline-guard/
