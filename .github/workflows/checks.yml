name: Check and build
on:
  push:
    branches-ignore: [qa/rustore-1.0.0]
  pull_request:
  workflow_dispatch:
    inputs:
      ads_mode:
        description: Yandex ad mode (test for device QA, live for release)
        type: choice
        options: [test, live]
        default: test
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vitest run --config scripts/regression-061/vitest.config.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config scripts/regression-061/playwright.config.ts
      - run: npm run test:e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
      - run: npm run build && npm run build:yandex
      - uses: actions/upload-artifact@v4
        with:
          name: seeds-bits-web
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: seeds-bits-yandex-draft
          path: dist-yandex/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: python3 scripts/regression-061/native-harness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-regression-061
          path: test-results/regression-061/
      - run: npm run setup:android
      - run: node scripts/configure-android.mjs
        env:
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY || vars.APPMETRICA_API_KEY }}
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID || vars.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.YANDEX_INTERSTITIAL_AD_UNIT_ID || vars.YANDEX_INTERSTITIAL_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID || vars.YANDEX_REWARDED_AD_UNIT_ID }}
          ADS_MODE: ${{ inputs.ads_mode || 'test' }}
          REQUIRE_MOBILE_CONFIG: ${{ github.event_name != 'pull_request' }}
      - run: npm run sync:android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: seeds-bits-android-preview-intermediate
          path: android/app/build/outputs/apk/debug/app-debug.apk
