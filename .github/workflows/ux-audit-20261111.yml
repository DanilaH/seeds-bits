name: Independent UX audit 2026-11-11
on:
  push:
    branches: [qa/ux-20261111]
permissions:
  contents: read
concurrency:
  group: ux-audit-20261111
  cancel-in-progress: true
jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEEDS_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Independent fresh-player, navigation and responsive UX scenarios
        run: node scripts/ux-audit-2026-11-11.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-ux-20261111
          path: test-results/ux-20261111/
          retention-days: 30
  android-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: seeds-rustore-release-unsigned
          path: ux-release/
          run-id: 42626758548
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Start a disposable Android 35 emulator and install the exact release payload
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' 'build-tools;35.0.0'
          echo no | avdmanager create avd --force --name seeds_ux --package 'system-images;android-35;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd seeds_ux -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2 > /tmp/seeds-ux-emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell wm size 780x1688
          adb shell wm density 320
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell settings put global http_proxy 127.0.0.1:9
          keytool -genkeypair -keystore /tmp/ux-smoke.p12 -storetype PKCS12 -storepass android -keypass android -alias ux -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI Disposable UX' -noprompt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/ux-smoke.p12 --ks-key-alias ux --ks-pass pass:android --out /tmp/seeds-ux.apk ux-release/app-release-unsigned.apk
          adb install /tmp/seeds-ux.apk
      - name: Actual native baseline and offline rewarded-return acceptance
        continue-on-error: true
        run: python3 scripts/android-smoke.py
      - name: Independent Android font, navigation and settings observations
        run: python3 scripts/android-ux-2026-11-11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-native-ux-20261111
          path: |
            test-results/android-ux-20261111/
            test-results/emulator/
          retention-days: 30
