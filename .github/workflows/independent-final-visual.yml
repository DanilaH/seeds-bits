name: Independent final visual stress audit 12108
on:
  push:
    branches: [qa/visual-final-12108-20261127]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: |
          npx vite --host 127.0.0.1 --port 5173 >/tmp/audit-vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node scripts/independent-final-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: visual-final-stress, path: test-results/visual-final/}
