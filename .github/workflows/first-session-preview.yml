name: First session preview
on:
  push:
    branches: [research/seeds-first-session-20261120, feat/seeds-content-v5-20261124, feat/seeds-v5-quality-20261125, feat/menu-package-20261125, feat/menu-audit-33-20261125, feat/menu-rails-20261125, feat/core-feel-pilot-20261125, feat/quiet-table-20261126]
    paths: [docs/STATUS.md, docs/porting/ADOPTION_LEDGER.json, docs/research/stability-2026-11-26/**, src/**, scripts/classic-pilot.mjs, scripts/classic-series.mjs, native/android/**, scripts/markets/**, tests/**, e2e/**, scripts/configure-android.mjs, scripts/gradle-maven-mirror.init.gradle, scripts/first-session-android.mjs, playwright.first-session.config.ts, .github/workflows/first-session-preview.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: first-session-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name == 'feat/core-feel-pilot-20261125' || github.ref_name == 'feat/quiet-table-20261126' }}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SEEDS_FIRST_SESSION: "1"
      VITE_SEEDS_QA_PROFILE: baseline
      SEEDS_BUILD_FLAVOR: preview
      ADS_MODE: test
      SEEDS_ARTIFACT_CHANNEL: rustore
      APPMETRICA_API_KEY: ""
      APPMETRICA_QA_API_KEY: ""
      REQUIRE_MOBILE_CONFIG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npx playwright test --config playwright.first-session.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: first-session-browser, path: test-results/}
      - run: npx playwright test --config playwright.markets.config.ts
      - name: Verify default sound and board feedback
        if: github.ref_name == 'feat/core-feel-pilot-20261125' || github.ref_name == 'feat/quiet-table-20261126'
        run: npx playwright test --config playwright.core-feel.config.ts
      - run: VITE_SEEDS_MARKET_QA=1 npm run build:yandex
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: markets-yandex-qa, path: dist-yandex/}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: markets-browser-controls, path: test-results/markets/}

  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: node scripts/run-quiet-audit.mjs
      - run: npx playwright test e2e/quiet-polish.spec.ts e2e/ui-audit12103.spec.ts e2e/playtest-followup.spec.ts e2e/gold-layout.spec.ts e2e/menu-package.spec.ts e2e/pair-feedback.spec.ts --workers=2
      - name: Verify notebook finishes and fresh-game bookmark clearance
        run: VITE_SEEDS_FIRST_SESSION=1 npx playwright test e2e/bookmark-followup.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: quiet-polish-visual-audit, path: test-results/}

  menu-reward-feel:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      VITE_SEEDS_FIRST_SESSION: "1"
      VITE_SEEDS_QA_PROFILE: baseline
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npx playwright test e2e/menu-reward-feel.spec.ts --workers=2
      - name: Record original dynamic audit and actual application audio before and after
        if: ${{ !cancelled() }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          git worktree add "$RUNNER_TEMP/menu-before" 125606e4a90e06b844fe6eb8f83249032cb7057f
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/menu-before/node_modules"
          npx vite --host 127.0.0.1 --port 5191 > "$RUNNER_TEMP/menu-after.log" 2>&1 &
          candidate_pid=$!
          (cd "$RUNNER_TEMP/menu-before" && "$GITHUB_WORKSPACE/node_modules/.bin/vite" --host 127.0.0.1 --port 5192) > "$RUNNER_TEMP/menu-before.log" 2>&1 &
          baseline_pid=$!
          trap 'kill "$candidate_pid" "$baseline_pid" || true' EXIT
          for port in 5191 5192; do for attempt in $(seq 1 30); do curl -fsS "http://127.0.0.1:$port" >/dev/null && break || sleep 1; done; done
          GITHUB_SHA=125606e4a90e06b844fe6eb8f83249032cb7057f SEEDS_MENU_URL=http://127.0.0.1:5192 SEEDS_MENU_OUT=test-results/menu-feel-before node scripts/independent-menu-feel.mjs
          SEEDS_MENU_URL=http://127.0.0.1:5191 SEEDS_MENU_OUT=test-results/menu-feel-after node scripts/independent-menu-feel.mjs
          SEEDS_FEEL_URL=http://127.0.0.1:5192 node scripts/record-menu-reward.mjs before
          SEEDS_FEEL_URL=http://127.0.0.1:5191 node scripts/record-menu-reward.mjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-reward-feel-evidence
          path: test-results/

  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SEEDS_FIRST_SESSION: "1"
      VITE_SEEDS_QA_PROFILE: baseline
      GITHUB_RUN_NUMBER_PREVIEW: ${{ github.ref_name == 'feat/quiet-table-20261126' && '1007' || github.ref_name == 'feat/core-feel-pilot-20261125' && '997' || '994' }}
      SEEDS_MAVEN_CENTRAL_MIRROR: google
      SEEDS_BUILD_FLAVOR: preview
      ADS_MODE: test
      SEEDS_ARTIFACT_CHANNEL: rustore
      APPMETRICA_API_KEY: ""
      APPMETRICA_QA_API_KEY: ""
      REQUIRE_MOBILE_CONFIG: "false"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run setup:android
      - run: GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER_PREVIEW" node scripts/configure-android.mjs
      - run: |
          chmod +x android/gradlew
          cd android
          if ! ./gradlew -I ../scripts/gradle-maven-mirror.init.gradle assembleRelease assembleDebug; then
            ./gradlew -I ../scripts/gradle-maven-mirror.init.gradle --refresh-dependencies assembleRelease assembleDebug
          fi
      - run: |
          mkdir -p test-results/first-session-apk
          version_code=$(awk '$1 == "versionCode" { print $2 }' android/app/build.gradle)
          test -n "$version_code"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "test-results/first-session-apk/seeds-first-session-${version_code}-unsigned.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "test-results/first-session-apk/seeds-first-session-${version_code}-debug.apk"
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync("test-results/first-session-apk/source.json",JSON.stringify({source:process.env.GITHUB_SHA,versionCode:Number(process.argv[1]),firstSession:true,helpProfile:"baseline",analytics:false},null,2))' "$version_code"
      - uses: actions/upload-artifact@v4
        with: {name: first-session-preview-unsigned, path: test-results/first-session-apk/}

  android-regression:
    needs: preview
    strategy:
      fail-fast: false
      matrix:
        mode: [offline, demo]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SEEDS_ANDROID_TEST_MODE: ${{ matrix.mode }}
      SEEDS_ANDROID_CORE_FEEL: ${{ (github.ref_name == 'feat/core-feel-pilot-20261125' || github.ref_name == 'feat/quiet-table-20261126') && '1' || '0' }}
      VITE_SEEDS_FIRST_SESSION: "1"
      VITE_SEEDS_QA_PROFILE: baseline
      SEEDS_BUILD_FLAVOR: preview
      ADS_MODE: test
      SEEDS_ARTIFACT_CHANNEL: rustore
      APPMETRICA_API_KEY: ""
      APPMETRICA_QA_API_KEY: ""
      REQUIRE_MOBILE_CONFIG: "false"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "build-tools;36.0.0"
      - name: Check screenshot and video tools
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: {name: first-session-preview-unsigned, path: candidate/}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 15005703885
          merge-multiple: true
          run-id: 45579802309
          github-token: ${{ github.token }}
          path: baseline
      - run: |
          echo '4de5a8398d5deb9748cec6c5e89b9b78a44258a2f29f0b26f18dc1096ff7daf9  baseline/seeds-first-session-12088-unsigned.apk' | sha256sum -c -
          keytool -genkeypair -alias acceptance -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Ephemeral CI acceptance' -keystore "$RUNNER_TEMP/first-session-ci.p12" -storepass only-for-ci -keypass only-for-ci
          version_code=$(node -p 'require("./candidate/source.json").versionCode')
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$build_tools_dir" sign --ks "$RUNNER_TEMP/first-session-ci.p12" --ks-key-alias acceptance --ks-pass pass:only-for-ci --out "$RUNNER_TEMP/old-ci.apk" baseline/seeds-first-session-12088-unsigned.apk
          "$build_tools_dir" sign --ks "$RUNNER_TEMP/first-session-ci.p12" --ks-key-alias acceptance --ks-pass pass:only-for-ci --out "$RUNNER_TEMP/release-ci.apk" "candidate/seeds-first-session-${version_code}-unsigned.apk"
          "$build_tools_dir" sign --ks "$RUNNER_TEMP/first-session-ci.p12" --ks-key-alias acceptance --ks-pass pass:only-for-ci --out "$RUNNER_TEMP/new-ci.apk" "candidate/seeds-first-session-${version_code}-debug.apk"
      - run: node scripts/classic-series.mjs --before eae2bcbeaaa1a5c76872dddc7a7f79844988b60e
        if: matrix.mode == 'offline'
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'offline'
        with: {name: classic-series-comparison, path: test-results/classic-series/}
      - run: |
          node scripts/classic-pilot.mjs --bundle "$RUNNER_TEMP/seeds-classic-pilot.bundle.js"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/seeds-first-session-avd"
          mkdir -p "$ANDROID_AVD_HOME" test-results/first-session-android
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --force --name firstsession --package 'system-images;android-35;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd firstsession -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2 > test-results/first-session-android/emulator.log 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat test-results/first-session-android/emulator.log; exit 1; fi
            if [ "$(timeout 4 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          for attempt in $(seq 1 12); do
            if [ "$(timeout 4 adb shell id -u 2>/dev/null | tr -d '\r')" = 0 ]; then break; fi
            timeout 4 adb root || true
            sleep 2
          done
          test "$(adb shell id -u | tr -d '\r')" = 0
          adb shell input keyevent 82
          if [[ "$SEEDS_ANDROID_TEST_MODE" == demo ]]; then
            SEEDS_BANNER_ONLINE=1 node scripts/markets/android.mjs "$RUNNER_TEMP/new-ci.apk"
            exit
          fi
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell iptables -I OUTPUT '!' -o lo -j REJECT
          adb shell ip6tables -I OUTPUT '!' -o lo -j REJECT
          adb shell input keyevent 82
          node scripts/markets/android.mjs "$RUNNER_TEMP/new-ci.apk" "$RUNNER_TEMP/old-ci.apk" "$RUNNER_TEMP/release-ci.apk" "$RUNNER_TEMP/seeds-classic-pilot.bundle.js"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'markets-android-${{ matrix.mode }}', path: "test-results/markets-android/\ntest-results/first-session-android/emulator.log"}

  sign-preview:
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SIGNING_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Check preview signing configuration
        id: signing
        env:
          SEEDS_PREVIEW_KEYSTORE_BASE64: ${{ secrets.SEEDS_PREVIEW_KEYSTORE_BASE64 }}
          SEEDS_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SEEDS_PREVIEW_KEYSTORE_PASSWORD }}
          SEEDS_PREVIEW_KEY_ALIAS: ${{ secrets.SEEDS_PREVIEW_KEY_ALIAS }}
        run: |
          if [[ -z "$SEEDS_PREVIEW_KEYSTORE_BASE64" && -z "$SEEDS_PREVIEW_KEYSTORE_PASSWORD" && -z "$SEEDS_PREVIEW_KEY_ALIAS" ]]; then
            echo "::notice::Preview signing is waiting for repository secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$SEEDS_PREVIEW_KEYSTORE_BASE64" || -z "$SEEDS_PREVIEW_KEYSTORE_PASSWORD" || -z "$SEEDS_PREVIEW_KEY_ALIAS" ]]; then
            echo "::error::Set all three SEEDS_PREVIEW signing secrets."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v4
        if: steps.signing.outputs.configured == 'true'
      - name: Install the signing build tools
        if: steps.signing.outputs.configured == 'true'
        run: sdkmanager "build-tools;$SIGNING_BUILD_TOOLS"
      - uses: actions/download-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with: {name: first-session-preview-unsigned, path: unsigned-preview/}
      - name: Sign and verify the preview APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          SEEDS_PREVIEW_KEYSTORE_BASE64: ${{ secrets.SEEDS_PREVIEW_KEYSTORE_BASE64 }}
          SEEDS_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.SEEDS_PREVIEW_KEYSTORE_PASSWORD }}
          SEEDS_PREVIEW_KEY_ALIAS: ${{ secrets.SEEDS_PREVIEW_KEY_ALIAS }}
        run: |
          version_code=$(node -e '
            const source = require("./unsigned-preview/source.json");
            if (source.source !== process.env.GITHUB_SHA || !Number.isSafeInteger(source.versionCode) ||
                source.helpProfile !== "baseline" || source.analytics !== false ||
                source.firstSession !== true)
              throw Error("Unexpected preview build manifest");
            process.stdout.write(String(source.versionCode));
          ')
          unsigned="unsigned-preview/seeds-first-session-${version_code}-unsigned.apk"
          signed="signed-preview/seeds-preview-${version_code}-portrait.apk"
          unzip -Z1 "$unsigned" | awk '/assets\/public\/assets\/seeds-foley-.*\.ogg$/ { found=1 } END { exit !found }'
          build_tools="$ANDROID_HOME/build-tools/$SIGNING_BUILD_TOOLS"
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          if ! "$build_tools/zipalign" -c -P 16 4 "$unsigned"; then
            echo "::error::The unsigned APK failed zip alignment verification."
            exit 1
          fi
          manifest=$("$build_tools/aapt" dump badging "$unsigned")
          package_line="package: name='com.seedsbits.game.preview' versionCode='$version_code'"
          if [[ "$manifest" != "$package_line"* ]]; then
            echo "::error::The APK package or version does not match the preview manifest."
            exit 1
          fi

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/seeds-preview-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$SEEDS_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/preview.p12"
          printf '%s\n' "$SEEDS_PREVIEW_KEYSTORE_PASSWORD" > "$signing_dir/password"
          expected_certificate=ee910b7ef7ed79fe27f15c26f8b70324133ac77c87d137a09c492e7b2bb7de30
          certificate=$(keytool -exportcert -storetype PKCS12 -keystore "$signing_dir/preview.p12" \
            -alias "$SEEDS_PREVIEW_KEY_ALIAS" -storepass:file "$signing_dir/password" | sha256sum)
          if [[ "${certificate%% *}" != "$expected_certificate" ]]; then
            echo "::error::The keystore certificate does not match the existing Seeds preview."
            exit 1
          fi
          mkdir -p signed-preview
          "$apksigner" sign --ks "$signing_dir/preview.p12" --ks-key-alias "$SEEDS_PREVIEW_KEY_ALIAS" \
            --ks-pass "file:$signing_dir/password" --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false --out "$signed" "$unsigned"
          if ! "$build_tools/zipalign" -c -P 16 4 "$signed"; then
            echo "::error::The signed APK failed zip alignment verification."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$signed" | tee "$signing_dir/verification.txt"
          grep -Fxq "Signer #1 certificate SHA-256 digest: $expected_certificate" "$signing_dir/verification.txt"
          grep -Fqx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$signing_dir/verification.txt"
          grep -Fqx 'Verified using v3 scheme (APK Signature Scheme v3): true' "$signing_dir/verification.txt"
          (
            cd signed-preview
            sha256sum "seeds-preview-${version_code}-portrait.apk" > SHA256SUMS
          )
          cp unsigned-preview/source.json signed-preview/
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: first-session-preview-signed
          path: signed-preview/
          if-no-files-found: error
