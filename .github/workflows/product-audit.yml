name: Product audit
on:
  push:
    branches: [qa/product-audit-20261111]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SEEDS_CHROMIUM: /usr/bin/google-chrome
      SEEDS_VISUAL_SWEEP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install ffmpeg
      - run: npm test
      - run: npm run build
      - run: npx vitest run --config scripts/regression-061/vitest.config.ts
      - run: npx playwright test --config scripts/regression-061/playwright.config.ts
      - run: npm run test:e2e
        if: ${{ !cancelled() }}
      - name: Repeated cross-tab settings acceptance
        if: ${{ !cancelled() }}
        run: npx playwright test e2e/audit-fixes.spec.ts -g 'different settings fields' --repeat-each 30 --workers 1 --output test-results/preferences-repeat
      - run: node scripts/ux-audit-2026-11-11.mjs
        if: ${{ !cancelled() }}
      - run: node scripts/product-journey.mjs
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-journey
          path: test-results/
          retention-days: 30
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SEEDS_BUILD_FLAVOR: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/regression-061/native-harness.py && python3 scripts/feedback-native-harness.py
      - run: npm run setup:android
      - run: node scripts/configure-android.mjs
        env:
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY || vars.APPMETRICA_API_KEY }}
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID || vars.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.YANDEX_INTERSTITIAL_AD_UNIT_ID || vars.YANDEX_INTERSTITIAL_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID || vars.YANDEX_REWARDED_AD_UNIT_ID }}
          ADS_MODE: live
          REQUIRE_MOBILE_CONFIG: true
      - run: npm run sync:android
      - run: |
          sed -i 's/networkTimeout=10000/networkTimeout=60000/' android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: seeds-product-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seeds-product-r8-reports
          path: android/app/build/outputs/mapping/release/
      - name: Collect public signing tools
        run: |
          mkdir -p release-tools
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          sdk=Path(os.environ['ANDROID_HOME'])/'build-tools'
          tools=max(sdk.iterdir(),key=lambda p:[int(v) if v.isdigit() else 0 for v in p.name.split('.')])
          for name in ['zipalign','aapt2']:shutil.copy2(tools/name,Path('release-tools')/name)
          shutil.copy2(tools/'lib/apksigner.jar','release-tools/apksigner.jar')
          if (tools/'lib64').exists():shutil.copytree(tools/'lib64','release-tools/lib64',dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seeds-product-release-tools
          path: release-tools/
  native:
    env:
      SEEDS_UPGRADE_BASELINE_KIND: previously built pre-release payload
      SEEDS_UPGRADE_BASELINE_SOURCE: e92bd4915d677caf47f74944402c82d48b483d9c
      SEEDS_UPGRADE_BASELINE_VERSION: '1.1.0 (1100024)'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DanBloomberg/leptonica
          ref: 13275a278eb55b5746e33f95fbf5a2c8f604b3ab
          path: .ci-ocr/leptonica
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tesseract-ocr/tesseract
          ref: 7e548e6eff172f38f97664afe7f7ce40db36c8d6
          path: .ci-ocr/tesseract
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tesseract-ocr/tessdata_fast
          ref: 87416418657359cb625c412a48b6e1d6d41c29bd
          path: .ci-ocr/tessdata
          sparse-checkout: rus.traineddata
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: python3 -m pip install --user pillow
      - run: bash scripts/ci-install-ocr.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: seeds-product-release-unsigned
          path: new-release/
      - uses: actions/download-artifact@v4
        with:
          name: seeds-rustore-release-unsigned
          path: baseline/
          run-id: 42626758548
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Start disposable offline Android 35
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' 'build-tools;35.0.0'
          echo no | avdmanager create avd --force --name seeds_111 --package 'system-images;android-35;google_apis;x86_64'
          bash scripts/ci-offline-emulator.sh seeds_111
          keytool -genkeypair -keystore /tmp/ux111.p12 -storetype PKCS12 -storepass android -keypass android -alias ux -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI UX Acceptance' -noprompt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/ux111.p12 --ks-key-alias ux --ks-pass pass:android --out /tmp/seeds-old.apk baseline/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/ux111.p12 --ks-key-alias ux --ks-pass pass:android --out /tmp/seeds-new.apk new-release/app-release-unsigned.apk
          adb install /tmp/seeds-new.apk
      - run: python3 scripts/android-ux111.py
      - run: |
          adb uninstall com.seedsbits.game
          adb install /tmp/seeds-old.apk
      - run: python3 scripts/android-upgrade.py before
      - run: adb install -r /tmp/seeds-new.apk
      - run: python3 scripts/android-upgrade.py after
      - run: |
          adb uninstall com.seedsbits.game
          adb install /tmp/seeds-new.apk
      - run: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seeds-product-native-acceptance
          path: |
            test-results/emulator/
            test-results/emulator-upgrade/
            test-results/ux111-native/
            test-results/offline-guard/
            test-results/ci-packages/
