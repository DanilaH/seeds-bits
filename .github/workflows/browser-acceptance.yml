name: Browser acceptance with system Chrome
on:
  push:
    branches: [qa/ui-1.0.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEEDS_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record installed browser
        run: |
          test -x "$SEEDS_CHROMIUM"
          mkdir -p test-results
          "$SEEDS_CHROMIUM" --version | tee test-results/browser-version.txt
      - run: npm test
      - run: npx vitest run --config scripts/regression-061/vitest.config.ts
      - run: npx playwright test --config scripts/regression-061/playwright.config.ts
      - run: npm run test:e2e
        if: ${{ !cancelled() }}
      - run: npm run build && npm run build:yandex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: test-results/
