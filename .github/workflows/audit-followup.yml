name: Production SDK and audio audit followup
on:
  push:
    branches: [qa/audit-followup-20261023]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEEDS_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:yandex
      - run: node scripts/audit-2026-10-23/followup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-sdk-audio-audit
          path: test-results/audit-2026-10-23/
