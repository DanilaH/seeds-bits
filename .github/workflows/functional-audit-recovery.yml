name: Independent recovery verification 12108
on:
  push:
    branches: [qa/functional-audit-12108-20261127-recovery]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npx playwright test e2e/functional-audit-recovery.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: functional-recovery, path: test-results/functional-followup/}
