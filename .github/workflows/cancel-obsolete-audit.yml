name: Cancel obsolete audit runs
on:
  push:
    branches: [fix-audit-061]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'checks.yml', branch: 'fix-audit-061', per_page: 30
            });
            for (const run of data.workflow_runs) {
              if (run.head_sha !== context.sha && ['queued','in_progress'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
              }
            }
