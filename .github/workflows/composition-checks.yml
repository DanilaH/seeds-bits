name: Verify responsive game composition
on:
  push:
    branches: [qa/composition-20261023]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEEDS_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npx vitest run --config scripts/regression-061/vitest.config.ts
      - run: python3 scripts/regression-061/native-harness.py
      - run: npx playwright test --config scripts/regression-061/playwright.config.ts
      - name: Verify new composition and capture screens
        run: npx playwright test e2e/composition.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-first-review
          path: |
            test-results/composition/
            test-results/main/
      - run: npm run test:e2e
        if: ${{ !cancelled() }}
      - run: npm run build && npm run build:yandex
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-acceptance
          path: test-results/
